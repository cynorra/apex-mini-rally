name: Android release (AAB + APK)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODOT_VERSION: "4.6"
  GODOT_CHANNEL: "stable"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O templates.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          unzip -q templates.zip -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          godot --version

      - name: Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "platforms;android-36" "cmake;3.10.2.4988404" "ndk;28.1.13356709" > /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Android build template
        run: |
          set -e
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.${GODOT_CHANNEL}" > android/.build_version
          touch android/build/.gdignore

      - name: Import project
        run: godot --headless --import || true

      - name: Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/upload.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=ApexMiniRally, OU=Cynorra, O=Cynorra, L=Istanbul, ST=Istanbul, C=TR"
          fi

      - name: Inject CI version code
        run: |
          sed -i "s/version\/code=1/version\/code=$GITHUB_RUN_NUMBER/g" export_presets.cfg

      - name: Export release AAB and APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: upload
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/apex-mini-rally.aab
          godot --headless --export-release "Android APK" build/apex-mini-rally.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apex-mini-rally
          path: |
            build/*.aab
            build/*.apk
